name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Android project
        run: flutter create --platforms=android --project-name louqaro .

      - name: Camera permission and app name
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="louqaro"|android:label="لوقارو"|' android/app/src/main/AndroidManifest.xml

      - name: Download Arabic font
        run: |
          mkdir -p assets/fonts
          if curl -fL -o assets/fonts/Lalezar-Regular.ttf https://github.com/google/fonts/raw/main/ofl/lalezar/Lalezar-Regular.ttf; then
            printf '  fonts:\n    - family: Lalezar\n      fonts:\n        - asset: assets/fonts/Lalezar-Regular.ttf\n' >> pubspec.yaml
          else
            echo "font download failed, using default font"
          fi

      - name: Make wolf icon
        run: |
          pip install pillow
          python make_icon.py

      - run: flutter pub get

      - run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: louqaro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
